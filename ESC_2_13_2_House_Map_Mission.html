    .houseWrap{position:absolute;left:50%;bottom:62px;width:390px;height:430px;transform:translateX(-50%)}.house{position:absolute;left:68px;bottom:0;width:260px;height:340px;filter:drop-shadow(0 12px 8px rgba(48,65,53,.2))}.roof{position:absolute;left:-25px;top:0;width:310px;height:95px;background:#d95f59;clip-path:polygon(50% 0,100% 100%,0 100%);transition:.5s}.chimney{position:absolute;right:36px;top:26px;width:35px;height:75px;background:#a84443}.floor{position:absolute;left:0;width:260px;height:126px;background:#fff4d6;border:7px solid #7e5a49;transition:.5s;opacity:.28;filter:grayscale(.8)}.floor.on{opacity:1;filter:none;animation:build .55s}.floor2{top:91px}.floor1{top:210px}.divider{position:absolute;left:0;right:0;top:203px;border-top:7px solid #7e5a49}.window{position:absolute;width:57px;height:58px;background:#8ee4f4;border:6px solid white;box-shadow:0 0 0 3px #6b5148}.w1{left:22px;top:122px}.w2{right:22px;top:122px}.w3{left:20px;top:241px}.door{position:absolute;right:32px;top:238px;width:60px;height:102px;background:#58a777;border:6px solid white}.doorknob{position:absolute;right:7px;top:47px;width:8px;height:8px;border-radius:50%;background:#ffd45c}.floorname{position:absolute;z-index:3;left:50%;transform:translateX(-50%);padding:4px 9px;border-radius:9px;background:rgba(255,255,255,.9);font-weight:950;white-space:nowrap}.floorname.top{top:182px}.floorname.bottom{top:301px}.garage{position:absolute;left:-28px;bottom:0;width:112px;height:91px;background:#c8d4df;border:6px solid #68534a;border-radius:7px 7px 0 0;transform:translateX(-120px);opacity:0;transition:.6s}.garage.on{transform:none;opacity:1}.garage:before{content:"车库";position:absolute;inset:19px 9px 0;background:repeating-linear-gradient(#eef2f5 0 11px,#aab8c3 12px 14px);text-align:center;padding-top:17px;font-weight:950}.garden{position:absolute;right:-15px;bottom:-3px;font-size:64px;transform:translateX(120px);opacity:0;transition:.6s}.garden.on{transform:none;opacity:1}.garden:after{content:"花园";display:block;text-align:center;font-size:17px;background:white;border-radius:9px;font-weight:950}.villaBadge{position:absolute;left:50%;top:-28px;transform:translateX(-50%) scale(0);background:#754fb5;color:white;border-radius:99px;padding:7px 15px;font-weight:950;transition:.4s;z-index:5}.villaBadge.on{transform:translateX(-50%) scale(1)}
    .roomlabels{position:absolute;inset:0;pointer-events:none}.room{position:absolute;background:white;border:2px solid #78a7c2;border-radius:8px;padding:3px 6px;font-weight:900;font-size:13px;opacity:0;transform:scale(.5);transition:.3s}.room.show{opacity:1;transform:scale(1)}.r-bed{left:80px;top:125px}.r-bath{right:75px;top:125px}.r-guest{left:143px;top:165px}.r-living{left:78px;top:244px}.r-kitchen{right:72px;top:244px}.r-dining{left:136px;top:282px}.positionFlag{position:absolute;top:92px;left:8px;right:8px;text-align:center;font-weight:950;color:#604397;font-size:18px}
    .sentenceZone{min-height:95px;border:3px dashed #8ab8cb;border-radius:16px;background:#fff;padding:11px;display:flex;gap:8px;flex-wrap:wrap;align-content:flex-start;margin:10px 0}.tiles{min-height:100px;border-radius:16px;background:#edf2f7;padding:11px;display:flex;gap:8px;flex-wrap:wrap;align-content:flex-start}.tile{border:2px solid #9e82d2;border-radius:11px;background:white;color:#553d89;padding:8px 12px;font-size:21px;font-weight:950;cursor:pointer;box-shadow:0 3px 0 #c3b4df}.finish{text-align:center;padding:35px 5px}.finish .award{font-size:82px}.finish h2{font-size:34px;color:#6846ac;margin:8px}.hidden{display:none!important}.confetti{position:fixed;top:-18px;width:11px;height:16px;z-index:20;animation:fall 1.8s linear forwards}@keyframes fall{to{transform:translate(var(--drift),105vh) rotate(720deg)}}@keyframes build{from{transform:translateY(-45px);opacity:0}}
    @media(max-width:900px){.layout{grid-template-columns:1fr}.stage{min-height:535px}.panel{min-height:auto}}@media(max-width:560px){.app{padding:8px}.tabs{grid-template-columns:1fr}.choices{grid-template-columns:1fr}.houseWrap{transform:translateX(-50%) scale(.85);transform-origin:bottom}.stage{min-height:500px}.header{padding:11px}.panel{padding:12px}}
  </style>

<body>
<main class="app">
  <header class="header"><div><h1>🏠 ESC-2-13-2 · House Map Mission</h1><div class="sub">房子地图任务｜Word List 2 + Word List 1 Review</div></div><div class="stats"><div class="stat">Score<b id="score">0</b></div><div class="stat">Stars<b id="stars">0 ⭐</b></div><div class="stat">Task<b id="counter">1 / 8</b></div></div></header>
  <div class="progress"><div id="progressFill"></div></div>
  <nav class="tabs"><button class="tab active" data-tab="build">1 · Build the House<br>选词 + 建房子</button><button class="tab" data-tab="floor">2 · Floor Detective<br>楼层侦探</button><button class="tab" data-tab="position">3 · Front / Back + Sentences<br>前后位置 + 组句</button></nav>
  <section class="layout">
    <div class="panel">
      <div id="quizView"><span class="tasktag" id="taskTag">TASK 1 · HOUSE WORDS</span><div class="question"><div class="prompt" id="prompt"></div><div class="hint" id="hint"></div></div><div class="choices" id="choices"></div><div class="feedback" id="feedback"></div><div class="navrow"><button class="smallbtn" id="speakBtn">🔊 Listen</button><button class="mainbtn" id="nextBtn" disabled>Next ▶</button></div></div>
      <div id="sentenceView" class="hidden"><span class="tasktag">TASK 5 · SENTENCE BUILDER</span><div class="question"><div class="prompt">Build the sentence</div><div class="hint" id="sentenceHint"></div></div><div class="sentenceZone" id="answerZone"></div><div class="tiles" id="tiles"></div><div class="feedback" id="sentenceFeedback"></div><div class="navrow"><button class="smallbtn" id="clearBtn">↩ Clear</button><button class="mainbtn" id="checkBtn">✓ Check Answer</button></div></div>
      <div id="finishView" class="finish hidden"><div class="award">🏆🏠⭐</div><h2>Mission Complete!</h2><p>你完成了房子地图的五种任务！</p><p id="finalScore"></p><button class="mainbtn" id="restartBtn">Play Again 再玩一次</button></div>
    </div>
    <aside class="panel stage"><div class="sun"></div><div class="cloud">☁</div><div class="positionFlag" id="stageMessage">答对问题，开始建房子！</div><div class="houseWrap"><div class="villaBadge" id="villaBadge">别墅 · villa</div><div class="house"><div class="chimney"></div><div class="roof"></div><div class="floor floor2" id="floor2"></div><div class="floor floor1" id="floor1"></div><div class="divider"></div><div class="window w1"></div><div class="window w2"></div><div class="window w3"></div><div class="door"><i class="doorknob"></i></div><div class="floorname top">二楼 · second floor</div><div class="floorname bottom">一楼 · first floor</div><div class="roomlabels"><span class="room r-bed">卧室</span><span class="room r-bath">浴室</span><span class="room r-guest">客房</span><span class="room r-living">客厅</span><span class="room r-kitchen">厨房</span><span class="room r-dining">餐厅</span></div></div><div class="garage" id="garage"></div><div class="garden" id="garden">🌳🌷</div></div><div class="groundLabel" id="groundLabel">House Map · 房子地图</div></aside>
  </section>
</main>
<script>
  const HOUSE_WORDS=[
    {q:"villa",a:"别墅",o:["楼房","别墅","花园","车库"],s:"别墅"},{q:"multi-storey building",a:"楼房",o:["楼房","房间","一楼","花园"],s:"楼房"},{q:"ground / first floor",a:"一楼",o:["一楼","二楼","前面","后面"],s:"一楼"},{q:"floor; storey",a:"层",o:["楼","层","面","间"],s:"层"},{q:"garden",a:"花园",o:["车库","客房","花园","浴室"],s:"花园"},{q:"garage",a:"车库",o:["厨房","车库","楼房","卫生间"],s:"车库"}
  ];
  const BUILD=[
    {q:"这是一座有两层的……",h:"This is a two-storey villa.",a:"别墅",o:["别墅","一楼","花园","客房"],part:"villa",s:"别墅有两层。"},
    {q:"别墅有几层？",h:"How many floors does the villa have?",a:"两层",o:["一层","两层","三层","四层"],part:"floors",s:"别墅有两层。"},
    {q:"Where do you park a car?",h:"选择正确的中文。",a:"车库",o:["花园","车库","浴室","餐厅"],part:"garage",s:"车库"},
    {q:"Where can flowers grow?",h:"选择正确的中文。",a:"花园",o:["客房","楼房","花园","厨房"],part:"garden",s:"花园"}
  ];
  const FLOOR=[
    {q:"厨房在一楼。",h:"The kitchen is on the first floor.",a:"对 ✓",o:["对 ✓","不对 ✗"],s:"厨房在一楼。"},
    {q:"客房在一楼。",h:"The guest room is on the first floor.",a:"不对 ✗",o:["对 ✓","不对 ✗"],s:"客房在二楼。"},
    {q:"二楼有三间卧室。",h:"There are three bedrooms upstairs.",a:"对 ✓",o:["对 ✓","不对 ✗"],s:"二楼有三间卧室。"},
    {q:"一楼有一个客厅。",h:"There is a living room downstairs.",a:"对 ✓",o:["对 ✓","不对 ✗"],s:"一楼有一个客厅。"},
    {q:"二楼有厨房和餐厅。",h:"The kitchen and dining room are upstairs.",a:"不对 ✗",o:["对 ✓","不对 ✗"],s:"厨房和餐厅在一楼。"},
    {q:"浴室在哪一层？",h:"Where are the bathrooms?",a:"二楼",o:["一楼","二楼","房子前面","房子后面"],s:"浴室在二楼。"},
    {q:"一楼有什么？",h:"What is on the first floor?",a:"客厅、餐厅、厨房和卫生间",o:["客厅、餐厅、厨房和卫生间","卧室、浴室和客房","车库和花园","三间卧室"],s:"一楼有客厅、餐厅、厨房和卫生间。"}
  ];
  const POSITION=[
    {q:"车库在哪里？",h:"Where is the garage?",a:"在房子的前面",o:["在房子的前面","在房子的后面"],s:"车库在房子的前面。",part:"garage"},
    {q:"花园在哪里？",h:"Where is the garden?",a:"在房子的后面",o:["在房子的前面","在房子的后面"],s:"花园在房子的后面。",part:"garden"},
    {q:"车库在房子的后面。",h:"The garage is behind the house.",a:"不对 ✗",o:["对 ✓","不对 ✗"],s:"车库在房子的前面。",part:"garage"},
    {q:"花园在房子的后面。",h:"The garden is behind the house.",a:"对 ✓",o:["对 ✓","不对 ✗"],s:"花园在房子的后面。",part:"garden"}
  ];
  const SENTENCES=[
    {a:["我家","住","楼房","。"],e:"My family lives in an apartment building."},{a:["我家","住","一楼","。"],e:"My family lives on the first floor."},{a:["我家","住","别墅","。"],e:"My family lives in a villa."},{a:["别墅","有","两层","。"],e:"The villa has two floors."},{a:["一楼","有","客厅、餐厅、厨房","和","卫生间","。"],e:"Downstairs has a living room, dining room, kitchen and toilet."},{a:["二楼","有","三间卧室","和","两个浴室","。"],e:"Upstairs has three bedrooms and two bathrooms."},{a:["车库","在","房子的前面","。"],e:"The garage is in front of the house."},{a:["花园","在","房子的后面","。"],e:"The garden is behind the house."}
  ];
  const $=id=>document.getElementById(id),shuffle=a=>{a=[...a];for(let i=a.length-1;i;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
  let tab="build",subtask="words",index=0,score=0,stars=0,locked=false,deck=[],answer=[],sentenceDeck=[];
  function speak(t){if(!("speechSynthesis" in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="zh-CN";u.rate=.78;speechSynthesis.speak(u)}
  function activeData(){return tab==="build"?(subtask==="words"?HOUSE_WORDS:BUILD):tab==="floor"?FLOOR:POSITION}
  function taskName(){return tab==="build"?(subtask==="words"?"TASK 1 · HOUSE WORDS 选房子词":"TASK 2 · BUILD THE HOUSE 建房子"):tab==="floor"?"TASK 3 · FLOOR DETECTIVE 楼层侦探":"TASK 4 · FRONT OR BACK 前面还是后面"}
  function switchTab(next){tab=next;subtask="words";index=0;locked=false;document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("active",b.dataset.tab===tab));$("finishView").classList.add("hidden");if(tab==="position"&&sessionStorage.getItem("houseSentences")==="1")showSentences();else{$("sentenceView").classList.add("hidden");$("quizView").classList.remove("hidden");renderQuestion()}}
  function renderQuestion(){const data=activeData();if(index>=data.length){if(tab==="build"&&subtask==="words"){subtask="construction";index=0;renderQuestion();return}if(tab==="position"){showSentences();return}feedback("✓ This tab is complete! 这个任务完成了！",true);$("nextBtn").disabled=true;$("counter").textContent="Done!";$("progressFill").style.width="100%";return}locked=false;$("nextBtn").disabled=true;$("taskTag").textContent=taskName();const item=data[index];$("prompt").textContent=item.q;$("hint").textContent=item.h||"Choose the correct Chinese word. 选择正确的中文词。";$("feedback").textContent="";const box=$("choices");box.innerHTML="";shuffle(item.o).forEach(text=>{const b=document.createElement("button");b.className="choice";b.textContent=text;b.onclick=()=>choose(b,text);box.appendChild(b)});$("counter").textContent=`${index+1} / ${data.length}`;$("progressFill").style.width=`${index/data.length*100}%`;updateStats();stageText()}
  function choose(btn,text){if(locked)return;locked=true;const item=activeData()[index];document.querySelectorAll(".choice").forEach(b=>{if(b.textContent===item.a)b.classList.add("correct")});if(text===item.a){btn.classList.add("correct");score+=100;stars++;feedback("✓ Correct! 太棒了！",true);speak(item.s||item.a);reveal(item);burst()}else{btn.classList.add("wrong");feedback(`再想一想！正确答案是：${item.a}`,false)}$("nextBtn").disabled=false;$("progressFill").style.width=`${(index+1)/activeData().length*100}%`;updateStats()}
  function reveal(item){if(tab==="build"){if(subtask==="words"){if(item.a==="一楼")$("floor1").classList.add("on");if(item.a==="别墅")$("villaBadge").classList.add("on");if(item.a==="车库")$("garage").classList.add("on");if(item.a==="花园")$("garden").classList.add("on")}else{if(item.part==="villa")$("villaBadge").classList.add("on");if(item.part==="floors"){$("floor1").classList.add("on");$("floor2").classList.add("on")}if(item.part==="garage")$("garage").classList.add("on");if(item.part==="garden")$("garden").classList.add("on")}}if(tab==="floor")document.querySelectorAll(".room").forEach(x=>x.classList.add("show"));if(tab==="position"){$("garage").classList.add("on");$("garden").classList.add("on");$("groundLabel").textContent=item.part==="garage"?"前面 FRONT ← 车库":"花园 → 后面 BACK"}}
  function feedback(t,good){$("feedback").textContent=t;$("feedback").style.color=good?"#25966f":"#dc4b5d"}
  function updateStats(){$("score").textContent=score;$("stars").textContent=stars+" ⭐"}
  function stageText(){const m=tab==="build"?(subtask==="words"?"认词成功后，房子部件会出现！":"答对一题，把别墅建起来！"):tab==="floor"?"一楼还是二楼？仔细看房间地图。":"FRONT 前面 · BACK 后面";$("stageMessage").textContent=m;if(tab==="floor"){$("floor1").classList.add("on");$("floor2").classList.add("on");document.querySelectorAll(".room").forEach(x=>x.classList.add("show"))}if(tab==="position"){$("floor1").classList.add("on");$("floor2").classList.add("on");$("garage").classList.add("on");$("garden").classList.add("on")}}
  function next(){index++;renderQuestion()}
  function showSentences(){sessionStorage.setItem("houseSentences","1");$("quizView").classList.add("hidden");$("sentenceView").classList.remove("hidden");sentenceDeck=sentenceDeck.length?sentenceDeck:shuffle(SENTENCES);index=0;renderSentence()}
  function renderSentence(){if(index>=sentenceDeck.length){finish();return}answer=[];const s=sentenceDeck[index];$("sentenceHint").textContent=s.e;$("sentenceFeedback").textContent="";$("answerZone").innerHTML="";$("tiles").innerHTML="";shuffle(s.a.map((t,i)=>({t,i}))).forEach(o=>addTile(o,$("tiles")));$("counter").textContent=`${index+1} / ${sentenceDeck.length}`;$("progressFill").style.width=`${index/sentenceDeck.length*100}%`}
  function addTile(o,parent){const b=document.createElement("button");b.className="tile";b.textContent=o.t;b.onclick=()=>{const destination=parent===$("tiles")?$("answerZone"):$("tiles");if(parent===$("tiles"))answer.push(o);else answer=answer.filter(x=>x.i!==o.i);addTile(o,destination);b.remove()};parent.appendChild(b)}
  function clearSentence(){renderSentence()}
  function checkSentence(){const s=sentenceDeck[index],made=answer.map(x=>x.t).join("");if(made===s.a.join("")){score+=150;stars++;updateStats();$("sentenceFeedback").style.color="#25966f";$("sentenceFeedback").textContent="✓ Perfect sentence! 句子完全正确！";speak(made);burst();setTimeout(()=>{index++;renderSentence()},1100)}else{$("sentenceFeedback").style.color="#dc4b5d";$("sentenceFeedback").textContent=answer.length<s.a.length?"句子还没有完成哦！":"顺序不对，再试一次！"}}
  function finish(){$("sentenceView").classList.add("hidden");$("finishView").classList.remove("hidden");$("finalScore").textContent=`Final Score: ${score} · ${stars} Stars`;$("progressFill").style.width="100%";$("counter").textContent="Done!";for(let i=0;i<4;i++)setTimeout(burst,i*350)}
  function burst(){const colors=["#ffc857","#ef6171","#46c6a0","#8a62d6","#fff"];for(let i=0;i<24;i++){const c=document.createElement("i");c.className="confetti";c.style.left=Math.random()*100+"vw";c.style.background=colors[i%colors.length];c.style.setProperty("--drift",(Math.random()*180-90)+"px");c.style.animationDelay=Math.random()*.2+"s";document.body.appendChild(c);setTimeout(()=>c.remove(),2100)}}
  function restart(){score=stars=0;sentenceDeck=[];sessionStorage.removeItem("houseSentences");["floor1","floor2","garage","garden","villaBadge"].forEach(id=>$(id).classList.remove("on"));document.querySelectorAll(".room").forEach(x=>x.classList.remove("show"));updateStats();switchTab("build")}
  document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>switchTab(b.dataset.tab));$("nextBtn").onclick=next;$("speakBtn").onclick=()=>{const d=activeData();if(d[index])speak(d[index].s||d[index].q)};$("clearBtn").onclick=clearSentence;$("checkBtn").onclick=checkSentence;$("restartBtn").onclick=restart;renderQuestion();
</script>
</body>
</html>
